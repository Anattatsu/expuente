<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL EXPUENTE D' TATA | Carta Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { red: '#e50914', redDark: '#b20710', black: '#0a0a0a', card: '#141414', border: '#2a2a2a' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #e50914; }
        .glow-red { box-shadow: 0 0 30px rgba(229, 9, 20, 0.3); }
        body {
            background: linear-gradient(to bottom, #1a0304 0%, #0a0a0a 40%, #0a0a0a 100%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="text-gray-100 font-sans min-h-screen flex flex-col">

    <header class="bg-gradient-to-b from-zinc-950 to-brand-black border-b border-brand-border py-8 px-4 text-center relative overflow-hidden">
        <div class="max-w-5xl mx-auto relative z-10 space-y-3">
            <div class="w-14 h-14 rounded-full bg-brand-red border-2 border-red-500/50 flex items-center justify-center text-white text-xl mx-auto shadow-lg glow-red">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <h1 class="font-serif font-black text-3xl md:text-4xl tracking-wider text-white">EL EXPUENTE D' TATA</h1>
            <p class="text-xs md:text-sm text-brand-red uppercase tracking-widest font-bold">Tradicionalmente delicioso desde 1997</p>
            
            <div class="flex justify-center gap-3 pt-2">
                <a href="index.html" class="bg-zinc-900 border border-zinc-800 hover:border-brand-red text-gray-300 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i> Volver al Menú
                </a>
                <a href="https://wa.me/573127474810?text=Hola,%20quiero%20hacer%20un%20pedido%20desde%20la%20carta" target="_blank" class="bg-brand-red hover:bg-brand-redDark text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 glow-red shadow-lg">
                    <i class="fa-brands fa-whatsapp text-sm"></i> Whatsapp: 312 7474810
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div id="cartaContainer" class="columns-1 md:columns-2 lg:columns-3 gap-6 [column-fill:_balance] space-y-6"></div>
    </main>

    <footer class="bg-zinc-950 border-t border-brand-border py-6 text-center text-xs text-gray-500">
        <p>El Expuente d' Tata &copy; 1997 - Todos los derechos reservados.</p>
    </footer>

    <script src="baseDeDatos.js"></script>
    <script>
        function renderCarta() {
            const db = getDB();
            const container = document.getElementById('cartaContainer');
            if (!db.products || !db.categories) return;

            const categoriesMap = {};
            db.categories.forEach(c => {
                if (c.id !== 'todas') categoriesMap[c.id] = { name: c.name, items: [] };
            });

            db.products.forEach(p => {
                if (p.active && categoriesMap[p.category]) categoriesMap[p.category].items.push(p);
            });

            let html = '';
            for (const [catId, catData] of Object.entries(categoriesMap)) {
                if (catData.items.length === 0) continue;
                html += `
                    <div class="bg-brand-card border border-brand-border rounded-2xl p-5 shadow-xl break-inside-avoid space-y-3">
                        <div class="border-b border-brand-red/40 pb-2">
                            <h2 class="font-serif font-black text-brand-red text-xs md:text-sm tracking-wide uppercase">${catData.name}</h2>
                        </div>
                        <div class="space-y-3">
                `;
                catData.items.forEach(item => {
                    html += `
                        <div class="flex items-start justify-between gap-3 pb-2.5 border-b border-zinc-800/40 last:border-0 last:pb-0">
                            <div class="space-y-0.5 flex-1">
                                <div class="flex items-center gap-1.5">
                                    <h3 class="font-bold text-white text-xs">${item.name}</h3>
                                    ${item.promo ? '<span class="px-1 py-0.5 rounded text-[8px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">PROMO</span>' : ''}
                                </div>
                                <p class="text-[10px] text-gray-400 leading-tight">${item.desc || ''}</p>
                            </div>
                            <span class="font-mono font-bold text-white text-xs whitespace-nowrap">$ ${item.price.toLocaleString()}</span>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }

        window.addEventListener('storage', (e) => { if (e.key === DB_KEY) renderCarta(); });
        document.addEventListener('DOMContentLoaded', renderCarta);
    </script>
</body>
</html>
